services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DEM_PATH: /data/mosaic/canada_elv.vrt
      PORT: "8000"
      API_KEY: "${API_KEY:-dev-local-key}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-2000000}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"

  terracotta:
    build:
      context: .
      dockerfile: Dockerfile.terracotta
    volumes:
      - ./data:/data:ro
    ports:
      - "8080:8080"
