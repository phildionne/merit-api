name: Python Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Check Ruff formatting
        run: ruff format --check api tests scripts

      - name: Run Ruff lint checks
        run: ruff check api tests scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run BasedPyright (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          basedpyright 2>&1 | tee "$output_file"
          {
            echo "## BasedPyright (advisory)"
            echo
            echo '```text'
            cat "$output_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
