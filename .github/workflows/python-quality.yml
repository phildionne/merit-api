name: Python Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Sync project
        run: uv sync --locked

      - name: Check Ruff formatting
        run: uv run ruff format --check api tests scripts

      - name: Run Ruff lint checks
        run: uv run ruff check api tests scripts

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Run BasedPyright (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          uv run basedpyright 2>&1 | tee "$output_file"
          {
            echo "## BasedPyright (advisory)"
            echo
            echo '```text'
            cat "$output_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
