name: Python Quality

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Read mise tool versions
        id: tools
        run: |
          python_version="$(awk -F '"' '/^[[:space:]]*python[[:space:]]*=/{ print $2 }' mise.toml)"
          uv_version="$(awk -F '"' '/^[[:space:]]*uv[[:space:]]*=/{ print $2 }' mise.toml)"
          test -n "$python_version"
          test -n "$uv_version"
          echo "python=$python_version" >> "$GITHUB_OUTPUT"
          echo "uv=$uv_version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ steps.tools.outputs.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true

      - name: Sync project
        run: UV_CACHE_DIR=.uv-cache uv sync --locked --group dev

      - name: Compile check
        run: UV_CACHE_DIR=.uv-cache uv run python -m compileall -q src tests scripts

      - name: Check Ruff formatting
        run: UV_CACHE_DIR=.uv-cache uv run ruff format --check src tests scripts

      - name: Run Ruff lint checks
        run: UV_CACHE_DIR=.uv-cache uv run ruff check .

      - name: Run BasedPyright
        shell: bash
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          UV_CACHE_DIR=.uv-cache uv run basedpyright --project basedpyrightconfig.json 2>&1 | tee "$output_file"
          {
            echo "## BasedPyright"
            echo
            echo '```text'
            cat "$output_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Read mise tool versions
        id: tools
        run: |
          python_version="$(awk -F '"' '/^[[:space:]]*python[[:space:]]*=/{ print $2 }' mise.toml)"
          uv_version="$(awk -F '"' '/^[[:space:]]*uv[[:space:]]*=/{ print $2 }' mise.toml)"
          test -n "$python_version"
          test -n "$uv_version"
          echo "python=$python_version" >> "$GITHUB_OUTPUT"
          echo "uv=$uv_version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ steps.tools.outputs.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true

      - name: Sync project
        run: UV_CACHE_DIR=.uv-cache uv sync --locked --group dev

      - name: Run tests
        run: UV_CACHE_DIR=.uv-cache uv run pytest -q tests
