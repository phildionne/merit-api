[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merit-api"
version = "0.1.0"
description = "River elevation API backed by MERIT-Hydro data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.0",
    "gunicorn==21.2.0",
    "rasterio==1.4.4",
    "uvicorn==0.29.0",
]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "basedpyright==1.28.1",
    "ruff==0.11.2",
]
test = [
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.ruff]
target-version = "py312"
src = ["api", "tests", "scripts"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"scripts/summarize_coverage_quality.py" = ["E402"]

[tool.basedpyright]
include = ["api", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    ".git",
    ".pytest_cache",
    "data",
    "viewer",
]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
failOnWarnings = false
reportMissingTypeStubs = false
