[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merit-api"
version = "0.1.0"
description = "River elevation API backed by MERIT-Hydro data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "gunicorn>=21.2.0",
    "rasterio>=1.4.4",
    "uvicorn>=0.29.0",
]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "basedpyright==1.28.1",
    "ruff==0.11.2",
]
test = [
    "httpx==0.27.0",
    "pytest==9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["merit_api*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"scripts/summarize_coverage_quality.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
